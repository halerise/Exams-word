        <!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Computer Applications CAT</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h1>Computer Applications CAT</h1>

        <p class="subtitle">
            Microsoft Word & Basic Computer Knowledge
        </p>


        <div class="exam-info">

            <p>
                <strong>Questions:</strong> 30
            </p>

            <p>
                <strong>Format:</strong> Multiple Choice
            </p>

            <p>
                <strong>Students:</strong> 2
            </p>

        </div>


        <form method="POST">

            <h2>Student 1</h2>

            <label>
                Student ID Number
            </label>

            <input
                type="text"
                name="student1_id"
                placeholder="Student 1 ID"
                required
            >

            <label>
                Student Name
            </label>

            <input
                type="text"
                name="student1_name"
                placeholder="Student 1 full name"
                required
            >


            <hr>


            <h2>Student 2</h2>

            <label>
                Student ID Number
            </label>

            <input
                type="text"
                name="student2_id"
                placeholder="Student 2 ID"
                required
            >

            <label>
                Student Name
            </label>

            <input
                type="text"
                name="student2_name"
                placeholder="Student 2 full name"
                required
            >


            <button type="submit">
                Start Exam
            </button>

        </form>

    </div>

</div>


</body>
</html>
